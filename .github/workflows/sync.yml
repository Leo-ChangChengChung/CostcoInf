name: Sync posts

on:
  schedule:
    # 每 2 小時。GitHub 用 UTC，排程也可能晚一點才跑。
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch posts
        run: |
          for i in 1 2 3; do
            if python scripts/sync_posts.py; then
              exit 0
            fi
            echo "第 ${i} 次抓取失敗，保留舊資料"
            if [ "$i" -lt 3 ]; then
              sleep 20
            fi
          done
          echo "三次都失敗，這次不更新，流程仍標成成功"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "沒有新內容"
          else
            git commit -m "更新目擊情報圖片清單"
            git push origin HEAD
          fi
